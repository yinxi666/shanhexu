<head>

  <script>history.scrollRestoration = "manual"</script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <meta name="view-transition" content="same-origin">

  <meta property="og:title" content="学习留言墙 - 赓续血脉・数绘红旅">

  <link rel="icon" type="image/png" href="../favicon.png?v=2026081309">
  <link rel="manifest" href="../manifest.json">

  <link rel="stylesheet" href="../css/home.css?v=2026081309">
  <link rel="stylesheet" href="../css/components.css?v=2026081309">
  <link rel="stylesheet" href="../css/pages.css?v=2026081309">
  <link rel="stylesheet" href="../css/widgets.css?v=2026081309">
  <link rel="stylesheet" href="../css/effects.css?v=2026081309">
  <link rel="stylesheet" href="../css/dark.css?v=2026081309">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-hong-lei-zhuo-shu-regular@1.0.6/font.min.css">
</head>

<body>


  <!-- ===== 导航栏（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-header"></div>

  <main>
    <!-- ===== 页面 Hero ===== -->
    <section class="subpage-hero">
      <video class="flag-video" src="../assets/演示视频/国旗动态壁纸【无水印】.mp4" preload="none" poster="../assets/页面通用图片/留言板.webp" loop muted playsinline
        aria-hidden="true"></video>
      <img class="hero-bg animate-ken-burns no-context-menu" draggable="false" src="../assets/页面通用图片/留言板.webp"
        alt="" aria-hidden="true">
      <div class="subpage-hero-content">
        <h1 class="subpage-hero-title">学习留言墙</h1>
        <p class="subpage-hero-subtitle">展示实践心得与学习感悟，支持前端模拟提交交互，你的声音将在这里被看到</p>
      </div>
    </section>

    <!-- ===== 留言区 ===== -->
    <section class="section">
      <div class="section-heading align-left">
        <h2><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.5L3 21l2-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg> 学习感悟</h2>
        <p>来自参与红色文旅实践的同学们的真实心得与感悟</p>
      </div>

      <!-- 软木板留言展示 -->
      <div class="message-list" id="message-list-container">
        <div class="empty-state">
          <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v5l4 4-4 4v5M17 3v5l-4 4 4 4v5"/></svg></div>
          <h3>加载中…</h3>
        </div>
      </div>

      <!-- 提交表单（软木板下方） -->
      <div class="message-form-card" id="message-form-card">
        <h3><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l.8-4.5L16 4.3a2 2 0 0 1 2.8 0l.9.9a2 2 0 0 1 0 2.8L8.5 19.2z"/><path d="M14.5 6.5l3 3"/></svg> 写下你的感悟</h3>
        <div class="form-body">
          <form id="msg-form">
            <div class="form-row">
              <div class="form-group form-group-half">
                <label for="msg-author">姓名 <span class="required">*</span></label>
                <input type="text" id="msg-author" placeholder="请输入你的姓名" required maxlength="20">
              </div>
              <div class="form-group form-group-half">
                <label for="msg-studentid">学号</label>
                <input type="text" id="msg-studentid" placeholder="选填" maxlength="20">
              </div>
              <div class="form-group form-group-half">
                <label for="msg-class">班级</label>
                <select id="msg-class">
                  <option value="">选择班级（选填）</option>
                  <option value="计算机2025级01班">计算机2025级01班</option>
                  <option value="计算机2025级02班">计算机2025级02班</option>
                  <option value="计算机2025级03班">计算机2025级03班</option>
                  <option value="物联网2025级01班">物联网2025级01班</option>
                  <option value="大数据2025级01班">大数据2025级01班</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="msg-title">心得标题 <span class="required">*</span></label>
              <input type="text" id="msg-title" placeholder="给你的感悟起个标题" required maxlength="50">
            </div>
            <div class="form-group">
              <label for="msg-content">感悟内容 <span class="required">*</span></label>
              <textarea id="msg-content" placeholder="分享你的实践心得、学习感悟或对红色文化的理解（至少20个字）…" required
                minlength="20"></textarea>
            </div>
            <button type="submit" class="form-submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M8 6.5L12 3l4 3.5"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg> 提交感悟</button>
          </form>
        </div>
        <div class="form-success">
          <div class="success-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></div>
          <h4>提交成功！</h4>
          <p>你的感悟已提交（前端模拟），当前显示为"审核中"状态。</p>
          <button class="btn primary mt-16" data-action="reset-message-form"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l.8-4.5L16 4.3a2 2 0 0 1 2.8 0l.9.9a2 2 0 0 1 0 2.8L8.5 19.2z"/><path d="M14.5 6.5l3 3"/></svg>
            再写一条</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 页脚扩展（覆盖共享模板第三列） ===== -->
  <template id="footer-extra">
    <h4>隐私说明</h4>
    <ul aria-label="关于页脚">
      <li>本留言墙为前端模拟功能</li>
      <li>用户数据仅存储于本地浏览器</li>
      <li>正式上线前需完善隐私保护</li>
      <li>图文素材经授权使用，来源说明见 docs/素材说明/</li>
    </ul>
  </template>
  <!-- ===== 页脚（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-footer"></div>

  <script type="module" src="../js/app.js?v=2026081309"></script>

</body>

</html>
