<html lang="zh-CN">

<head>

  <script>history.scrollRestoration = "manual"</script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="view-transition" content="same-origin">
  <meta name="description" content="学习留言墙，记录红色文旅实践心得与感悟。">
  <meta property="og:title" content="学习留言墙 - 赓续血脉・数绘红旅">

  <link rel="canonical" href="https://yinxi666.github.io/shanhexu/pages/message.html">
  <title>学习留言墙 - 赓续血脉・数绘红旅</title>
  <link rel="icon" type="image/png" href="../favicon.png?v=2026080416">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/base.css?v=2026080416">
  <link rel="stylesheet" href="../css/home.css?v=2026080416">
  <link rel="stylesheet" href="../css/components.css?v=2026080416">
  <link rel="stylesheet" href="../css/pages.css?v=2026080416">
  <link rel="stylesheet" href="../css/widgets.css?v=2026080416">
  <link rel="stylesheet" href="../css/effects.css?v=2026080416">
  <link rel="stylesheet" href="../css/dark.css?v=2026080416">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-hong-lei-zhuo-shu-regular@1.0.6/font.min.css">
</head>

<body>
  <div id="nav-curtain">
    <div class="nc-front"></div>
    <div class="nc-back"></div>
  </div>


  <!-- ===== 导航栏（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-header"></div>

  <main>
    <!-- ===== 页面 Hero ===== -->
    <section class="subpage-hero">
      <video class="flag-video" src="../assets/演示视频/国旗动态壁纸【无水印】.mp4" autoplay loop muted playsinline
        aria-hidden="true"></video>
      <img class="hero-bg animate-ken-burns no-context-menu" draggable="false" src="../assets/页面通用图片/留言板.webp"
        alt="留言墙">
      <div class="subpage-hero-content">
        <h1 class="subpage-hero-title">学习留言墙</h1>
        <p class="subpage-hero-subtitle">展示实践心得与学习感悟，支持前端模拟提交交互，你的声音将在这里被看到</p>
      </div>
    </section>

    <!-- ===== 留言区 ===== -->
    <section class="section">
      <div class="section-heading align-left">
        <h2>💬 学习感悟</h2>
        <p>来自参与红色文旅实践的同学们的真实心得与感悟</p>
      </div>

      <!-- 软木板留言展示 -->
      <div class="message-list" id="message-list-container">
        <div class="empty-state">
          <div class="empty-icon">⏳</div>
          <h3>加载中…</h3>
        </div>
      </div>

      <!-- 提交表单（软木板下方） -->
      <div class="message-form-card" id="message-form-card">
        <h3>✍️ 写下你的感悟</h3>
        <div class="form-body">
          <form id="msg-form">
            <div class="form-row">
              <div class="form-group form-group-half">
                <label for="msg-author">姓名 <span class="required">*</span></label>
                <input type="text" id="msg-author" placeholder="请输入你的姓名" required maxlength="20">
              </div>
              <div class="form-group form-group-half">
                <label for="msg-studentid">学号</label>
                <input type="text" id="msg-studentid" placeholder="选填" maxlength="20">
              </div>
              <div class="form-group form-group-half">
                <label for="msg-class">班级</label>
                <select id="msg-class">
                  <option value="">选择班级（选填）</option>
                  <option value="计算机2025级01班">计算机2025级01班</option>
                  <option value="计算机2025级02班">计算机2025级02班</option>
                  <option value="计算机2025级03班">计算机2025级03班</option>
                  <option value="物联网2025级01班">物联网2025级01班</option>
                  <option value="大数据2025级01班">大数据2025级01班</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="msg-title">心得标题 <span class="required">*</span></label>
              <input type="text" id="msg-title" placeholder="给你的感悟起个标题" required maxlength="50">
            </div>
            <div class="form-group">
              <label for="msg-content">感悟内容 <span class="required">*</span></label>
              <textarea id="msg-content" placeholder="分享你的实践心得、学习感悟或对红色文化的理解（至少20个字）…" required
                minlength="20"></textarea>
            </div>
            <button type="submit" class="form-submit">📤 提交感悟</button>
          </form>
        </div>
        <div class="form-success">
          <div class="success-icon">✅</div>
          <h4>提交成功！</h4>
          <p>你的感悟已提交（前端模拟），当前显示为"审核中"状态。</p>
          <button class="btn primary mt-16" data-action="reset-message-form">✍️
            再写一条</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 页脚扩展（覆盖共享模板第三列） ===== -->
  <template id="footer-extra">
    <h4>隐私说明</h4>
    <ul>
      <li>本留言墙为前端模拟功能</li>
      <li>用户数据仅存储于本地浏览器</li>
      <li>正式上线前需完善隐私保护</li>
      <li>图文素材经授权使用，来源说明见 docs/素材说明/</li>
    </ul>
  </template>
  <!-- ===== 页脚（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-footer"></div>

  <script type="module" src="../js/app.js?v=2026080416"></script>

</body>

</html>
