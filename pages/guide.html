<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <script>(function () { try { if (localStorage.getItem('redguide_dark') === '1') document.documentElement.classList.add('dark') } catch (e) { } })();</script>
  <script>history.scrollRestoration = "manual"</script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <meta name="view-transition" content="same-origin">
  <meta name="description" content="全国红色场馆导览，支持按地区、类别或关键词搜索。">
  <meta property="og:title" content="全国红色场馆导览 - 赓续血脉・数绘红旅">
  <meta property="og:description" content="覆盖全国34个省级行政区的红色文旅场馆导览。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yinxi666.github.io/shanhexu/pages/guide.html">
  <meta property="og:image" content="https://yinxi666.github.io/shanhexu/assets/icons/icon-512.png">
  <link rel="canonical" href="https://yinxi666.github.io/shanhexu/pages/guide.html">
  <link rel="icon" type="image/png" href="../favicon.png?v=2026080515">
  <link rel="manifest" href="../manifest.json">
  <title>全国红色场馆导览 - 赓续血脉・数绘红旅</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="../css/base.css?v=2026080515">
  <link rel="stylesheet" href="../css/home.css?v=2026080515">
  <link rel="stylesheet" href="../css/components.css?v=2026080515">
  <link rel="stylesheet" href="../css/pages.css?v=2026080515">
  <link rel="stylesheet" href="../css/widgets.css?v=2026080515">
  <link rel="stylesheet" href="../css/effects.css?v=2026080515">
  <link rel="stylesheet" href="../css/dark.css?v=2026080515">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-hong-lei-zhuo-shu-regular@1.0.6/font.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <div id="nav-curtain">
    <div class="nc-front"></div>
    <div class="nc-back"></div>
  </div>


  <!-- ===== 导航栏（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-header"></div>

  <main>
    <!-- ===== Cinematic Hero ===== -->
    <section class="subpage-hero">
      <video class="flag-video" src="../assets/演示视频/国旗动态壁纸【无水印】.mp4" preload="none" poster="../assets/全国红色场馆图片/场馆04_江西_井冈山革命博物馆.webp" loop muted playsinline
        aria-hidden="true"></video>
      <img class="hero-bg animate-ken-burns no-context-menu" draggable="false"
        src="../assets/全国红色场馆图片/场馆04_江西_井冈山革命博物馆.webp" alt="红色场馆">
      <div class="subpage-hero-content">
        <h1 class="subpage-hero-title">全国红色场馆导览</h1>
        <p class="subpage-hero-subtitle">覆盖全国34个省级行政区的红色文旅场馆，支持按地区、类别或关键词进行内容查找</p>
      </div>
    </section>

    <!-- ===== 搜索与筛选区 ===== -->
    <section class="section">
      <div class="search-toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="输入场馆名称、地区或关键词…" aria-label="搜索场馆">
          <button id="guide-search-btn" type="button">搜索</button>
        </div>
        <select id="filter-province" aria-label="按地区筛选">
          <option value="all">全部地区</option>
        </select>
        <select id="filter-category" aria-label="按类别筛选">
          <option value="all">全部类别</option>
        </select>
        <button class="btn secondary small btn-map-toggle is-hidden" id="toggle-view-btn" title="切换地图/列表视图"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l6 2.5L20 5v15l-5 1.5L9 19l-5 1.5v-15z"/><path d="M9 4v15M14 6.5v15"/></svg>
          地图视图</button>
      </div>

      <!-- 结果计数 -->
      <div class="result-count" id="result-count"></div>

      <!-- 分栏布局：左列表 + 右地图 -->
      <div class="guide-layout">
        <div class="guide-list">
          <div class="venue-grid" id="venue-grid"></div>
          <div id="pagination-container"></div>
        </div>
        <div class="guide-map">
          <div class="guide-map-sticky">
            <div id="map-container"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 页脚扩展（覆盖共享模板第三列） ===== -->
  <template id="footer-extra">
    <h4>关于</h4>
    <ul>
      <li>四川农业大学信息工程学院</li>
      <li>场馆数据持续更新中</li>
      <li>信息以官方发布为准</li>
      <li>图文素材经授权使用，来源说明见 docs/素材说明/</li>
    </ul>
  </template>
  <!-- ===== 页脚（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-footer"></div>

  <script type="module" src="../js/app.js?v=2026080515"></script>

</body>

</html>
