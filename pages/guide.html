        <img src="../assets/学院标识_四川农业大学信息工程学院.webp" alt="川农信工" style="height:36px;width:auto;border-radius:4px;"><span class="brand-mark">红</span>

  <main>
    <!-- ===== Cinematic Hero ===== -->
    <section class="subpage-hero">
      <img class="hero-bg animate-ken-burns" draggable="false" oncontextmenu="return false;" src="../assets/全国红色场馆图片/场馆04_江西_井冈山革命博物馆.webp" alt="红色场馆">
      <div class="subpage-hero-content">
        <h1 class="subpage-hero-title">全国红色场馆导览</h1>
        <p class="subpage-hero-subtitle">覆盖全国34个省级行政区的红色文旅场馆，支持按地区、类别或关键词进行内容查找</p>
      </div>
    </section>

    <!-- ===== 搜索与筛选区 ===== -->
    <section class="section">
      <div class="search-toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="输入场馆名称、地区或关键词…" aria-label="搜索场馆">
          <button id="guide-search-btn" type="button">搜索</button>
        </div>
        <select id="filter-province" aria-label="按地区筛选">
          <option value="all">全部地区</option>
        </select>
        <select id="filter-category" aria-label="按类别筛选">
          <option value="all">全部类别</option>
        </select>
        <button class="btn secondary small" id="toggle-view-btn" title="切换地图/列表视图" style="white-space:nowrap;">🗺️
          地图视图</button>
      </div>

      <!-- 结果计数 + 视图切换 -->
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="result-count" id="result-count"></div>
      </div>

      <!-- 网格视图 -->
      <div class="venue-grid" id="venue-grid"></div>

      <!-- 地图视图 -->
      <div id="map-container"
        style="display:none;height:520px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);">
      </div>

      <!-- 分页 -->
      <div id="pagination-container"></div>
    </section>
  </main>
