<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>长征·二万五千里 - 赓续血脉・数绘红旅</title>
  <link rel="icon" type="image/png" href="../favicon.png?v=2026081516">
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/base.css?v=2026081516">
  <link rel="stylesheet" href="../css/home.css?v=2026081516">
  <link rel="stylesheet" href="../css/components.css?v=2026081516">
  <link rel="stylesheet" href="../css/pages.css?v=2026081516">
  <link rel="stylesheet" href="../css/widgets.css?v=2026081516">

  <style>
    /* ===== 长征页面禁用body默认padding ===== */
    body.cz-body {
      background: #0a0604;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body class="cz-body">

  <!-- ===== 导航栏（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-header"></div>

  <main id="cz-main">
    <!-- 沉浸页唯一的顶级标题（视觉隐藏，供读屏标题导航） -->
    <h1 class="sr-only">重走长征路</h1>
    <!-- ============================================================
         固定层 1/4：多层视差背景（山脉+宣纸+墨迹+mood+粒子）
         ============================================================ -->
    <div class="cz-bg" aria-hidden="true">
      <div class="cz-bg-paper"></div>
      <!-- 5种mood纯色叠加（素材暂不可用） -->
      <div class="cz-bg-mood cz-bg-mood-ember"></div>
      <div class="cz-bg-mood cz-bg-mood-blood"></div>
      <div class="cz-bg-mood cz-bg-mood-snow"></div>
      <div class="cz-bg-mood cz-bg-mood-swamp"></div>
      <div class="cz-bg-mood cz-bg-mood-gold"></div>
      <!-- 真实场景照片层（站点切换时显示实地照片） -->
      <div class="cz-bg-photo" id="czBgPhoto"></div>
      <!-- 山脉 silhouette -->
      <div class="cz-bg-layer cz-bg-mount-far"></div>
      <div class="cz-bg-layer cz-bg-mount-mid"></div>
      <div class="cz-bg-layer cz-bg-mount-near"></div>
      <div class="cz-bg-layer cz-bg-ground"></div>
      <div class="cz-bg-ink"></div>
      <div class="cz-bg-vignette"></div>
      <!-- Canvas粒子（从底部升起的火焰余烬） -->
      <canvas id="cz-atmos" class="cz-atmos" aria-hidden="true"></canvas>
    </div>

    <!-- ============================================================
         固定层 2/4：双卷轴 + 横向手卷（滚动=展开）
         ============================================================ -->
    <div class="cz-roll-stage">
      <!-- 左：收卷轴（木杆+铜轴头+木纹） -->
      <div class="cz-roller cz-roller-left" id="czRollerL">
        <div class="cz-roller-shaft"></div>
        <div class="cz-roller-cap cz-cap-top"></div>
        <div class="cz-roller-cap cz-cap-bottom"></div>
        <div class="cz-roller-grain"></div>
      </div>

      <!-- 中：横向手卷舞台（固定位置，内部手卷做translateX） -->
      <div class="cz-handroll-window">
        <!-- 手卷主体：超宽div，宽度=17站 × 每站约800px + 两端余量 -->
        <div class="cz-handroll" id="czHandroll">
          <!-- 宣纸纹理：repeat-x横向平铺 -->
          <div class="cz-handroll-paper"></div>
          <!-- 手绘山水场景：远山山脊 + 行军队伍（画在纸面上，随卷轴滚动） -->
          <div class="cz-scroll-scene" id="czScrollScene" aria-hidden="true">
            <svg class="cz-scene-ridge" viewBox="0 0 1200 100" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="czRidgeFar" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#3a2a18" stop-opacity="0.26" />
                  <stop offset="1" stop-color="#3a2a18" stop-opacity="0.5" />
                </linearGradient>
                <linearGradient id="czRidgeMid" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#3a2a18" stop-opacity="0.48" />
                  <stop offset="1" stop-color="#3a2a18" stop-opacity="0.75" />
                </linearGradient>
                <linearGradient id="czRidgeNear" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#3a2a18" stop-opacity="0.8" />
                  <stop offset="1" stop-color="#3a2a18" stop-opacity="0.96" />
                </linearGradient>
              </defs>
              <!-- 远山（最淡、最高） -->
              <path
                d="M0 100 L0 42 Q120 28 240 44 Q360 24 480 42 Q600 20 720 44 Q840 26 960 44 Q1080 28 1200 42 L1200 100 Z"
                fill="url(#czRidgeFar)" />
              <!-- 中山 -->
              <path d="M0 100 L0 54 Q160 40 320 56 Q480 36 640 56 Q800 40 960 56 Q1080 44 1200 54 L1200 100 Z"
                fill="url(#czRidgeMid)" />
              <!-- 近山（最深、最矮） -->
              <path d="M0 100 L0 66 Q200 52 400 68 Q600 48 800 68 Q1000 52 1200 66 L1200 100 Z"
                fill="url(#czRidgeNear)" />
            </svg>
            <div class="cz-scroll-march"></div>
          </div>
          <!-- 折痕：每200px一道横向阴影 -->
          <div class="cz-handroll-creases"></div>
          <!-- 手卷上下的光影（中央亮、卷边暗） -->
          <div class="cz-handroll-light"></div>
          <!-- 老宣纸墨点飞溅层（JS 注入不规则墨迹） -->
          <div class="cz-handroll-ink-dots" id="czInkDots"></div>
          <!-- 内容由 JS 注入：长征路线 + 17印章站点 + 17枚笺纸 -->
          <div class="cz-handroll-contents" id="czHandrollContents"></div>
        </div>
        <!-- 展开边缘的暖光（右手边展开轴附近一道更亮的光） -->
        <div class="cz-unfold-glow"></div>
        <!-- 从展开轴飘出的小尘埃 -->
        <div class="cz-dust" id="czDust" aria-hidden="true"></div>
      </div>

      <!-- 右：展开轴 -->
      <div class="cz-roller cz-roller-right" id="czRollerR">
        <div class="cz-roller-shaft"></div>
        <div class="cz-roller-cap cz-cap-top"></div>
        <div class="cz-roller-cap cz-cap-bottom"></div>
        <div class="cz-roller-grain"></div>
        <div class="cz-roller-light"></div>
      </div>
    </div>

    <!-- ============================================================
         滚动驱动层（纵向，高度=手卷长度→让用户可以滚）
         ============================================================ -->
    <div class="cz-scroll-driver" id="czScrollDriver"></div>
  </main> <!-- ============================================================
         固定层 3/4：HUD（左下）
         ============================================================ -->
  <div class="cz-hud" id="cz-hud">
    <button class="cz-sound-toggle" id="cz-sound-toggle" type="button" title="环境音开关" aria-label="开启环境音景" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l5 4V6l-5 4z"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg></button>
    <button class="cz-autoplay-btn" id="cz-autoplay-btn" type="button" title="自动行军" aria-label="自动行军"
      aria-pressed="false">▶ 自动行军</button>
    <div class="cz-hud-row" aria-live="polite">
      <span class="cz-hud-index" id="cz-hud-index">第 1 / 17 站</span>
      <span class="cz-hud-station" id="cz-hud-station">瑞金</span>
    </div>
    <div class="cz-hud-row">
      <span class="cz-hud-miles">已走 <b id="cz-hud-miles">0</b> / 25,000 里</span>
      <span class="cz-hud-year" id="cz-hud-year">1934.10</span>
    </div>
    <div class="cz-hud-bar">
      <div class="cz-hud-bar-fill" id="cz-hud-bar-fill"></div>
    </div>
    <div class="cz-hud-hint" id="cz-hud-hint">↓ 向下滚动，展开手卷</div>
  </div>

  <!-- ============================================================
         固定层 4/4：迷你路线地图（右上，内部可交互圆点跳转）
         ============================================================ -->
  <div class="cz-route-wrap">
    <div class="cz-route-head">
      <span class="cz-route-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 16 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.4"/></svg> 中央红军长征路线</span>
      <span class="cz-route-tag">二万五千里 · 17站</span>
    </div>
    <!-- role="group" 而非 role="img"：role="img" 会把内部可交互跳站圆点从读屏树里抹掉 -->
    <svg id="cz-route-svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid meet" role="group" aria-label="中央红军长征路线迷你地图">
      <path id="cz-route-track" d="" fill="none" stroke="rgba(200,160,90,0.15)" stroke-width="5" stroke-linecap="round"
        stroke-linejoin="round" />
      <path id="cz-route-fill" d="" fill="none" stroke="url(#cz-route-grad)" stroke-width="7" stroke-linecap="round"
        stroke-linejoin="round" />
      <defs>
        <linearGradient id="cz-route-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffd76e" />
          <stop offset="100%" stop-color="#ff8a3d" />
        </linearGradient>
      </defs>
      <g id="cz-route-dots"></g>
      <g id="cz-route-marker">
        <path d="M0,-12 L3.5,-3.8 L12,-3.8 L5.2,1.7 L7.9,9.8 L0,5 L-7.9,9.8 L-5.2,1.7 L-12,-3.8 L-3.5,-3.8 Z"
          fill="#ff3b30" stroke="#ffd76e" stroke-width="1.2" />
      </g>
    </svg>
  </div>

  <!-- ===== 诗句浮现层（路过站点浮现毛泽东诗词） ===== -->
  <div class="cz-poem-overlay" id="cz-poem-overlay" aria-hidden="true">
    <div class="cz-poem-text" id="cz-poem-text"></div>
    <div class="cz-poem-src" id="cz-poem-src"></div>
  </div>

  <!-- ===== 文物详情弹窗 ===== -->
  <div class="cz-relic-modal" id="cz-relic-modal" role="dialog" aria-modal="true" aria-label="文物详情" aria-hidden="true">
    <div class="cz-relic-modal-box">
      <button class="cz-relic-close" id="cz-relic-close" type="button" aria-label="关闭">✕</button>
      <div class="cz-relic-svg" id="cz-relic-svg"></div>
      <h3 id="cz-relic-name"></h3>
      <p id="cz-relic-story"></p>
      <div class="cz-relic-station" id="cz-relic-station"></div>
    </div>
  </div>

  <!-- ===== 终点成就：走完全程 ===== -->
  <div class="cz-complete" id="cz-complete" role="dialog" aria-modal="true" aria-label="长征终点成就" aria-hidden="true">
    <div class="cz-complete-inner">
      <div class="cz-complete-portrait"><img src="../assets/通用/毛主席雕像.webp" alt="毛主席雕像"></div>
      <div class="cz-complete-title">二万五千里</div>
      <div class="cz-complete-sub">走完全程 · 长征胜利</div>
      <p class="cz-complete-desc">
        指尖轻划，屏幕上两万五千里转瞬便走到终点，滑动不过片刻光景。<br><br>可百年前真实的征途，却用双脚丈量了整整春秋寒暑。<br><br>屏幕里的两万五千里到此止步，可真实历史里的风雪、草地、险峰从未褪色。<br><br>一代人走完救国之路，一代人守护盛世山河，长征从未结束，它藏在每一个向前奔赴的我们身上。
      </p>
      <button class="cz-complete-btn" id="cz-complete-btn" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M9.2 13.2L7.5 21l4.5-2.5L16.5 21l-1.7-7.8"/></svg> 领取长征纪念卡</button>
      <button class="cz-complete-close" id="cz-complete-close" type="button">✕ 关闭</button>
    </div>
  </div>

  <!-- ===== 长征纪念卡：专属弹窗 ===== -->
  <div class="cz-card-modal" id="cz-card-modal" role="dialog" aria-modal="true" aria-label="长征纪念卡" aria-hidden="true">
    <div class="cz-card-box">
      <button class="cz-card-close" id="cz-card-close" type="button" aria-label="关闭">✕</button>
      <div class="cz-card-head"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M9.2 13.2L7.5 21l4.5-2.5L16.5 21l-1.7-7.8"/></svg> 长征纪念卡</div>
      <p class="cz-card-sub">走完全程 · 二万五千里，留下一张专属纪念</p>
      <div class="cz-card-field">
        <label id="cz-card-bgs-label">① 选择背景</label>
        <div class="cz-card-bgs" id="cz-card-bgs" role="group" aria-labelledby="cz-card-bgs-label"></div>
      </div>
      <div class="cz-card-field">
        <label for="cz-card-name">② 你的姓名</label>
        <input type="text" id="cz-card-name" maxlength="6" placeholder="输入姓名（最多6字）" aria-required="true">
      </div>
      <div class="cz-card-field">
        <label id="cz-card-spirits-label">③ 精神关键词</label>
        <div class="cz-card-spirits" id="cz-card-spirits" role="group" aria-labelledby="cz-card-spirits-label"></div>
      </div>
      <button class="cz-card-gen" id="cz-card-gen" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/><path d="M12 4l1.8 6.2L20 12l-6.2 1.8L12 20l-1.8-6.2L4 12l6.2-1.8z"/></svg> 生成纪念卡</button>
      <div class="cz-card-preview is-hidden" id="cz-card-preview">
        <img id="cz-card-preview-img" alt="长征纪念卡预览">
        <div class="cz-card-actions">
          <button class="cz-card-dl" id="cz-card-download" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 11L12 15.5 16.5 11"/><path d="M4 19h16"/></svg> 下载</button>
          <button class="cz-card-share" id="cz-card-share" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M8 6.5L12 3l4 3.5"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg> 分享</button>
        </div>
      </div>
      <div class="cz-card-savehint is-hidden" id="cz-card-savehint"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 17.5h5"/><path d="M9 20h6"/><path d="M12 3a6 6 0 0 1 3.5 10.8c-.8.6-1.5 1.2-1.5 2.2h-4c0-1-.7-1.6-1.5-2.2A6 6 0 0 1 12 3z"/></svg> 长按图片可保存到相册</div>
    </div>
  </div>

  <!-- ===== 每站小剧场：实景 + 专属天气 + 氛围 ===== -->
  <div class="cz-theater" id="cz-theater" aria-hidden="true">
    <div class="cz-theater-photo" id="cz-theater-photo"></div>
    <canvas class="cz-theater-weather" id="cz-theater-weather"></canvas>
    <div class="cz-theater-fog" id="cz-theater-fog"></div>
    <div class="cz-theater-flash" id="cz-theater-flash"></div>
    <div class="cz-theater-vignette"></div>
    <div class="cz-theater-caption">
      <div class="cz-theater-name" id="cz-theater-name"></div>
      <div class="cz-theater-date" id="cz-theater-date"></div>
    </div>
  </div>

  <!-- ===== 页脚扩展（覆盖共享模板第三列） ===== -->
  <template id="footer-extra">
    <h4>声明</h4>
    <ul aria-label="关于页脚">
      <li>历史内容依据权威公开史料整理</li>
      <li>场馆链接指向本站详情页</li>
      <li>图文素材经授权使用，来源说明见 docs/素材说明/</li>
      <li>仅供学习交流使用</li>
    </ul>
  </template>
  <!-- ===== 页脚（由 js/layout-loader.js 注入共享模板） ===== -->
  <div id="site-footer"></div>

  <!-- ===== 脚本 ===== -->
  <script type="module" src="../js/app.js?v=2026081516"></script>
</body>

</html>
