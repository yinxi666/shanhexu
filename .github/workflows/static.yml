# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage deploy files
        shell: bash
        run: |
          # 仅打包站点运行所需的文件到 _site/，避免 server.js/README/docs/CI 等污染线上产物。
          # 注意：upload-pages-artifact 的 path 只接受单个路径，不支持多行列表。
          mkdir -p _site
          cp index.html favicon.png manifest.json .nojekyll _site/
          # nullglob：无匹配文件时 glob 展开为空数组，避免 cp *.jpg（当前根目录无 .jpg）因无匹配而失败
          shopt -s nullglob
          cp *.webp *.jpg _site/
          cp -r pages css js data assets images templates _site/
          # 页脚链接指向 docs/素材说明/（素材来源与授权说明）。仅拷该子目录，
          # 不部署 docs/ 下的内部部署说明（学校服务器部署说明.md）与失效参考页
          mkdir -p _site/docs
          cp -r docs/素材说明 _site/docs/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
